[build-system]
requires = ["hatchling==1.25.0"]
build-backend = "hatchling.build"

[project]
name = "aml-account-closure"
version = "1.0.0"
description = "Bloqueo y cierre de cuentas AML a partir de un Excel de Cumplimiento (Databricks)."
readme = "README.md"
requires-python = ">=3.11"
# Versiones abiertas: el cluster (DBR 15.4 LTS) ya trae estas librerías y pip no las reinstala.
# pymongo/bson los provee el cluster corporativo, por eso no se declara aquí.
dependencies = [
    "pandas>=1.5",
    "openpyxl>=3.0",
    "requests>=2.28",
]

[project.optional-dependencies]
# Fijadas para CI (GitHub Actions). numpy/pandas alineados con DBR 15.4 LTS.
dev = [
    "numpy==1.23.5",
    "pandas==1.5.3",
    "openpyxl==3.1.5",
    "requests==2.31.0",
    "pymongo==4.8.0",
    "mongomock==4.2.0.post1",
    "responses==0.25.3",
    "pytest==8.3.3",
    "pytest-cov==5.0.0",
    "ruff==0.6.9",
    "mypy==1.11.2",
    "types-requests==2.31.0.20240406",
    "build==1.2.2",
    "pre-commit==3.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aml_account_closure"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# El notebook de entrada usa globals de Databricks (dbutils, spark, display, conectar_mongo...).
"notebooks/*" = ["F821", "E402", "I001"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["pandas.*", "mongomock.*", "openpyxl.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "--cov=aml_account_closure --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["aml_account_closure"]
